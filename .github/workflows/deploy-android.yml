name: Deploy Android to Google Play (.NET 10)

on:
  # push:
  #   branches:
  #     - '**'
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  # TODO: Adicionar testes automatizados
  # O restore de pacotes NuGet para o projeto de testes (Service.Tests) está muito lento (~8min+).
  # O publish MAUI funciona porque o workload já tem pacotes pré-configurados.
  # Plano: primeiro implementar testes na action do UniqueServer (projeto mais simples),
  # validar que o cache de pacotes NuGet no servidor resolve o problema,
  # e depois replicar a solução aqui.
  # Por enquanto, rodar testes localmente antes de merge.
  
  build-test-and-release:
    if: (github.event_name == 'push' || github.event.pull_request.merged == true) && !contains(github.server_url, 'github.com')
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (Requisito para o Android SDK)
        uses: actions/setup-java@v4.0.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.0.0

      # Workload já instalado no servidor - reinstalar se atualizar o .NET SDK
      # - name: Install MAUI Android Workload
      #   run: dotnet workload install maui-android

      - name: Generate ApiKeys.cs
        run: |
          cat > ApiRepo/ApiKeys.cs << 'EOF'
          namespace ApiRepo
          {
              internal static class ApiKeys
              {
                  public const string ApiAddress = "${{ secrets.API_ADDRESS }}";
                  public const string KEY32 = "${{ secrets.KEY32 }}";
                  public const string IV16 = "${{ secrets.IV16 }}";
              }
          }
          EOF

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app.keystore          

      - name: Build and Publish (Generate AAB)
        run: |
          dotnet publish XpemFinancial/XpemFinancial.csproj -c Release -f net10.0-android \
            /p:ApplicationVersion=$(( ${{ github.run_number }} + 18 )) \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore=${{ github.workspace }}/app.keystore \
            /p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} \
            /p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }} \
            /p:AndroidSigningStorePass=${{ secrets.ANDROID_KEY_PASSWORD }}          

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.Xpem.XpemFinancial
          releaseFiles: |
            XpemFinancial/bin/Release/net10.0-android/*-Signed.aab            
          track: internal
          status: completed
